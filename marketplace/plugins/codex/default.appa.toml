# Default policy for a protected Codex session. The Codex battery supplies
# command selectors, result confinement, and the sanitizer. Rules match in
# order within each tool. Explicit contracts precede the wildcard classifier.

[policy]
version = 2

# Local utility operations whose output remains in the current session.
[[policy.tool]]
name = "host/codex/update_plan"
delta = {}

# An image can come from an untrusted or private path; classify the read.
[[policy.annotator]]
name = "codex.local-read"
builtin = "codex"
hint = "view_image reads the named local image. Treat an image from an unknown or externally writable path as suspicious, and a path that may contain the requester's private data as self."

[[policy.tool]]
name = "host/codex/view_image"
description = "Reads a local image for the agent."
annotator = "codex.local-read"

# Patch text is delivered as `tool_input.command`, including paths and new
# contents. The classifier sees that complete call; it must ask for trusted
# input when the patch changes instructions or policy. Hook and MCP
# configuration edits also require fresh human review. The classifier keeps
# the audience and trust restrictions for every file in a mixed patch.
[[policy.annotator]]
name = "codex.patch-requirements"
builtin = "codex"
marks = ["hitl"]
hint = """
Inspect additions, deletions, renames, and content.
Require trusted input for AGENTS.md, Codex instructions/settings, APPA policy, hooks, and credentials.
For hook or MCP edits, require fresh attention hitl even when trusted.
Protect these paths and relocated equivalents:
- .mcp.json
- .codex/config.toml
- .codex/hooks.json
- .codex/hooks/*
- .claude/hooks/*
Preserve trust and audience for every file in mixed patches.
For network destinations, require public unless the call establishes narrower readers.
"""

[[policy.tool]]
name = "host/codex/apply_patch"
description = "Applies a patch to local files."
annotator = "codex.patch-requirements"

# Reporting uses the same APPA-owned MCP identity in both harnesses.
[[policy.tool]]
name = "mcp/appa/yell"
requires = { audience = { contains = ["public"] } }
delta = {}

# A web query or URL leaves the session. External authors supply the result.
[[policy.tool]]
name = "host/codex/webrun"
requires = { audience = { contains = ["public"] } }
delta = { trust = "suspicious" }

# Subagent returns and peer messages need a verified lifecycle contract.
# The reserved blocked mark cannot receive human authorization.
[[policy.tool]]
name = "host/codex/spawn_agent"
requires = { attention = ["blocked"] }
delta = {}

[[policy.tool]]
name = "host/codex/wait"
requires = { attention = ["blocked"] }
delta = {}

[[policy.tool]]
name = "host/codex/send_input"
requires = { attention = ["blocked"] }
delta = {}

[[policy.tool]]
name = "host/codex/send_message"
requires = { attention = ["blocked"] }
delta = {}

[[policy.tool]]
name = "host/codex/close_agent"
requires = { attention = ["blocked"] }
delta = {}

[[policy.tool]]
name = "host/codex/resume_agent"
requires = { attention = ["blocked"] }
delta = {}

[[policy.tool]]
name = "host/codex/wait_agent"
requires = { attention = ["blocked"] }
delta = {}

[[policy.tool]]
name = "host/codex/collaborationresume_agent"
requires = { attention = ["blocked"] }
delta = {}

[[policy.tool]]
name = "host/codex/collaborationsend_input"
requires = { attention = ["blocked"] }
delta = {}

[[policy.tool]]
name = "host/codex/collaborationclose_agent"
requires = { attention = ["blocked"] }
delta = {}

[[policy.tool]]
name = "host/codex/collaborationsend_message"
requires = { attention = ["blocked"] }
delta = {}

[[policy.tool]]
name = "host/codex/followup_task"
requires = { attention = ["blocked"] }
delta = {}

[[policy.tool]]
name = "host/codex/collaborationfollowup_task"
requires = { attention = ["blocked"] }
delta = {}

[[policy.tool]]
name = "host/codex/interrupt_agent"
requires = { attention = ["blocked"] }
delta = {}

[[policy.tool]]
name = "host/codex/collaborationinterrupt_agent"
requires = { attention = ["blocked"] }
delta = {}

[[policy.tool]]
name = "host/codex/list_agents"
requires = { attention = ["blocked"] }
delta = {}

[[policy.tool]]
name = "host/codex/collaborationlist_agents"
requires = { attention = ["blocked"] }
delta = {}

# The command wrapper closes child stdin and does not forward later input.
[[policy.tool]]
name = "host/codex/appa_stdin"
requires = { attention = ["blocked"] }
delta = {}

# Codex reports a launch task path before its child UUID. The runtime records
# that receipt and binds the UUID from SubagentStart. A protected persistent
# launcher records profile eligibility for the root and proves each hook invocation.
# The child return crosses through SubagentStop. A wait admits only the exact
# completion status that the live probe verified.
# The automatic as-spoken contract uses the parent's current label as its floor.
[[policy.tool]]
name = "host/codex/collaborationspawn_agent"
delta = {}

[[policy.tool]]
name = "host/codex/collaborationwait_agent"
delta = {}

# Raw child text remains in persistent rollouts and external event streams.
# The profile denies sandboxed commands access to those rollouts. Resume, input,
# close, interrupt, follow-up, listing, and peer messages stay disabled.

[policy.deployment]
context_control = true
auto_return_as_spoken = true

# Like Claude Code, classify other hooked tools through the complete call.
# Classification still requires policy admission. No answer means refusal.
[[policy.annotator]]
name = "codex.undeclared-tool"
builtin = "codex"
ranks = ["suspicious", "trusted"]
marks = ["hitl"]
effects = []

[[policy.tool]]
name = "*"
annotator = "codex.undeclared-tool"

[[policy.authority]]
name = "hitl"
hint = "Ask the person running this Codex session to review the exact call, data, and required reader."

[policy.authority.permits]
trust_below = "trusted"
audience_missing = ["public"]
attention = ["*"]

[externals]
timeout_ms = 5000
review_timeout_ms = 600000
max_body_bytes = 65536

[externals.authorities.hitl]
builtin = "hitl"

# The saved Codex login is used by the `codex` Annotators. No API key is
# required. A consult has its own model deadline, separate from the short
# transport timeout above.
[externals.codex]
timeout_ms = 90000
max_concurrent = 2

[reporting]
agent_yell = false
