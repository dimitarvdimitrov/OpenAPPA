# Default policy for a protected Codex session. The Codex battery supplies
# command selectors, result confinement, and the sanitizer. Rules match in
# order; an unknown hooked tool has no declaration and is refused.

[policy]
version = 2

# Local utility operations whose output remains in the current session.
[[policy.tool]]
name = "host/codex/update_plan"
delta = {}

# An image can come from an untrusted or private path; classify the read.
[[policy.annotator]]
name = "codex.local-read"
builtin = "codex"
hint = "view_image reads the named local image. Treat an image from an unknown or externally writable path as suspicious, and a path that may contain the requester's private data as self."

[[policy.tool]]
name = "host/codex/view_image"
description = "Reads a local image for the agent."
annotator = "codex.local-read"

# Patch text is delivered as `tool_input.command`, including paths and new
# contents. The classifier sees that complete call; it must ask for trusted
# input when the patch changes instructions, hooks, or policy, and label
# external text it reads. A bare static allow would lose those distinctions.
[[policy.annotator]]
name = "codex.patch-requirements"
builtin = "codex"
hint = "The apply_patch command includes paths and replacement content. Require trusted input for edits to AGENTS.md, Codex instructions/settings/hooks, APPA policy, executable hooks, or credential files. Treat any network destination named in the patch as public unless the call establishes a narrower reader."

[[policy.tool]]
name = "host/codex/apply_patch"
description = "Applies a patch to local files."
annotator = "codex.patch-requirements"

# Reporting uses the same APPA-owned MCP identity in both harnesses.
[[policy.tool]]
name = "mcp/appa/yell"
requires = { audience = { contains = ["public"] } }
delta = {}

# This deployment deliberately does not declare spawn_agent, wait, or peer
# messaging. Their parent-visible result and child lifecycle still need a
# live Codex gate before a return contract can be asserted.

[[policy.authority]]
name = "hitl"
hint = "Ask the person running this Codex session to review the exact call, data, and required reader."

[policy.authority.permits]
trust_below = "trusted"
audience_missing = ["public"]
attention = ["*"]

[externals]
timeout_ms = 5000
review_timeout_ms = 600000
max_body_bytes = 65536

[externals.authorities.hitl]
builtin = "hitl"

# The saved Codex login is used by the `codex` Annotators. No API key is
# required. A consult has its own model deadline, separate from the short
# transport timeout above.
[externals.codex]
timeout_ms = 90000
max_concurrent = 2

[reporting]
agent_yell = false
