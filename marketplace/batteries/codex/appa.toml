[[policy.tool]]
name = "host/codex/appa_exec(command:*.npmrc*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/codex/appa_exec(command:*.pypirc*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/codex/appa_exec(command:*.azure/*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/codex/appa_exec(command:*.gnupg/*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/codex/appa_exec(command:*.config/gcloud/*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/codex/appa_exec(command:*.password-store/*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/codex/appa_exec(command:*.vault-token*)"
delta = { audience = ["self"] }
